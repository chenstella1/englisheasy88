<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>優華數位版權所有｜互動閱讀練習</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-paper: #faf8f3;
      --ink-main: #1e293b;
      --accent-teal: #0f766e;
      --accent-amber: #d97706;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background-color: var(--bg-paper);
      color: var(--ink-main);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    }
    .word-chip {
      display: inline;
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 2px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .word-chip:hover {
      background-color: #ccfbf1;
      color: #115e59;
    }
    .admin-picked-word {
      background-color: #fde68a !important;
      color: #78350f !important;
      outline: 2px solid #f59e0b;
      border-radius: 4px;
      font-weight: 800;
    }
    .sentence-block {
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      transition: background-color 0.15s ease;
    }
    .sentence-block:hover {
      background-color: #f0fdfa;
    }
    .sentence-block.active-sentence {
      background-color: #fef3c7;
    }
    .inline-blank-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 10px;
      margin: 0 3px;
      border-radius: 8px;
      border: 2px dashed #0d9488;
      background-color: #f0fdfa;
      color: #0f766e;
      font-weight: 800;
      font-size: 0.92em;
      cursor: pointer;
      vertical-align: baseline;
      transition: all 0.15s ease;
    }
    .inline-blank-btn:hover {
      background-color: #ccfbf1;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.2);
    }
    .inline-blank-btn.correct {
      border-style: solid;
      border-color: #059669;
      background-color: #d1fae5;
      color: #065f46;
    }
    .inline-blank-btn.wrong {
      border-style: solid;
      border-color: #e11d48;
      background-color: #ffe4e6;
      color: #9f1239;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .print-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-slate-900 text-white shadow-md no-print sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-400/40 flex items-center justify-center text-teal-300 font-black text-lg">
          優
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-extrabold tracking-wide" data-i18n="brandTitle">優華數位版權所有｜互動閱讀練習</h1>
            <span id="roleModeBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-teal-400/20 text-teal-200 border border-teal-300/30 font-semibold">學生練習模式</span>
          </div>
          <p id="headerSubtitle" class="text-xs text-slate-300">點單字查詞義發音｜點整句看中文翻譯｜點文內空格直接作答</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btnToggleLang" type="button" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs sm:text-sm font-bold transition">
          🌐 English / 中文
        </button>
        <a href="index.html" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-extrabold transition flex items-center gap-1 shadow-sm">
          <span>🏠</span>
          <span data-i18n="backHome">回主頁測驗</span>
        </a>
        <button id="btnPrintPage" type="button" onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs sm:text-sm font-semibold transition">
          <span data-i18n="printBtn">列印 / 存 PDF</span>
        </button>
        <button id="btnToggleAdmin" type="button" class="px-3 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 border border-amber-400/40 text-xs sm:text-sm font-bold transition">
          🔒 管理者模式
        </button>
      </div>
    </div>
  </header>

  <main id="mainGrid" class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6 flex-1">
    <section id="adminWorkspace" class="hidden no-print bg-white rounded-3xl border-2 border-teal-600/30 shadow-lg p-5 sm:p-7 space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
        <div>
          <h2 class="text-lg sm:text-xl font-black text-slate-900 flex items-center gap-2">
            <span class="w-2.5 h-6 rounded-full bg-teal-600"></span>
            <span data-i18n="adminEditorTitle">管理者文章編輯主區</span>
          </h2>
          <p class="text-xs text-slate-500 mt-0.5" data-i18n="adminEditorHint">直接在寬大編輯區撰寫或修改文章、挖空選項與中文解析，完成後可按「開新視窗預覽」或「儲存文章並發布至前台」。</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="btnOpenPreviewWindow" type="button" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-extrabold shadow-sm transition flex items-center gap-1.5">
            <span>🪟</span>
            <span data-i18n="openPreviewWin">開新視窗預覽</span>
          </button>
          <button id="btnSaveArticleToLibrary" type="button" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-black shadow-sm transition flex items-center gap-1.5">
            <span>💾</span>
            <span data-i18n="savePublish">儲存文章並發布至前台</span>
          </button>
        </div>
      </div>

      <label id="dropZone" for="fileInput" class="block border-2 border-dashed border-teal-300 hover:border-teal-500 bg-teal-50/40 hover:bg-teal-50/80 rounded-2xl p-4 text-center cursor-pointer transition">
        <div class="text-xl mb-0.5">📄🖼️📝</div>
        <div class="text-sm font-bold text-slate-700" data-i18n="uploadDropTitle">點擊選擇或拖曳 Word / PDF / 圖片學習單至此</div>
        <div class="text-xs text-slate-500 mt-0.5" data-i18n="uploadDropSub">自動辨識「文章＋文內挖空與選項＋下方閱讀測驗＋自動生解析」</div>
        <input id="fileInput" type="file" accept=".pdf,.docx,.odt,.jpg,.jpeg,.png,.webp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text,image/*" class="hidden" />
      </label>

      <div id="uploadStatus" class="hidden rounded-xl px-3.5 py-2.5 text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200 leading-relaxed"></div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5 pt-1">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1" data-i18n="categoryLabel">年級／程度分類</label>
          <select id="metaLevel" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold focus:outline-none focus:ring-2 focus:ring-teal-500">
            <option value="國七/基礎閱讀" selected>國七/基礎閱讀</option>
            <option value="國八/進階閱讀">國八/進階閱讀</option>
            <option value="國九/會考閱讀">國九/會考閱讀</option>
            <option value="高一/基礎閱讀">高一/基礎閱讀</option>
            <option value="高二/學測閱讀">高二/學測閱讀</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1" data-i18n="topicLabel">題型／主題標籤</label>
          <input id="metaTopic" type="text" value="文內挖空＋閱讀測驗" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1" data-i18n="titleLabel">文章標題</label>
          <input id="metaTitle" type="text" value="Where Is John's Wallet?" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-extrabold text-slate-700" data-i18n="enSourceLabel">英文原文編輯區（支援 [1] / ____ / (1)____ 挖空）</label>
            <button id="btnAutoTranslate" type="button" class="text-xs font-bold text-teal-700 hover:text-teal-900 underline" data-i18n="autoTranslateBtn">
              依原文斷句自動翻譯
            </button>
          </div>
          <textarea id="sourceTextInput" rows="12" class="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="直接輸入、編輯或上傳英文文章（支援 [1] 或 ____ 空格標記）..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-700 mb-1.5" data-i18n="zhTransLabel">全文中文翻譯編輯區（依英文斷句對齊）</label>
          <textarea id="translationTextInput" rows="12" class="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="直接輸入、修改或自動生成全文中文翻譯..."></textarea>
        </div>
      </div>

      <div class="border-t border-slate-200 pt-5 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label class="text-sm font-black text-teal-900" data-i18n="blankMgrTitle">文內挖空與選項解析管理</label>
          <div class="flex flex-wrap items-center gap-2">
            <button id="btnAutoDetectBlanks" type="button" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200">
              ⚡ 原文挖空＋選項自動生成
            </button>
            <button id="btnAddManualBlank" type="button" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white shadow-2xs">
              ＋ 新增一格挖空
            </button>
          </div>
        </div>

        <div class="rounded-2xl p-4 bg-indigo-50/70 border border-indigo-200/80 space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs sm:text-sm font-extrabold text-indigo-950" data-i18n="rawOptsTitle">📄 原檔挖空選項（Word / PDF 自動帶入或貼上）</span>
            <button id="btnParseRawBlankOptions" type="button" class="text-xs font-extrabold px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition">
              ✨ 自動配對選項＋出解析
            </button>
          </div>
          <textarea id="rawClozeOptionsInput" rows="4" class="w-full px-3 py-2 rounded-xl border border-indigo-200 bg-white text-xs sm:text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="上傳 Word / PDF 時會自動擷取挖空選項至此（也可直接貼上，例如：&#10;1. (A) behind (B) under (C) between (D) across&#10;2. (A) in front of (B) between (C) next (D) under&#10;Answer: 1. A 2. B）"></textarea>
          <p class="text-xs text-indigo-900/80 leading-snug" data-i18n="rawOptsHint">
            上傳含挖空與選項的 Word / PDF 後，系統會自動形成各格選項並產出中文解析，您可直接在下方卡片修改答案與解析。
          </p>
        </div>

        <div id="selectedWordBanner" class="rounded-xl px-3.5 py-2.5 bg-amber-50 border border-amber-200 text-xs text-amber-950 flex flex-wrap items-center justify-between gap-2">
          <div>
            <span class="font-bold">目前選取詞彙：</span>
            <span id="selectedWordDisplay" class="font-black text-teal-800">尚未點選或反白詞彙</span>
          </div>
          <span class="text-[11px] text-amber-800/80">點文章單字或反白後按「＋ 新增一格挖空」</span>
        </div>

        <div id="adminBlankManagerList" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1"></div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100">
        <div class="flex items
