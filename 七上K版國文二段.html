{t:"字音字形",q:"下列注音寫成國字後，哪一組字形相同？",o:["「ㄆㄨˊ」玉／返「ㄆㄨˊ」歸真","「ㄐㄧㄤ」繩／「ㄐㄧㄤ」硬","潛移「ㄇㄛˋ」化／胸無點「ㄇㄛˋ」","驚鴻一「ㄆㄧㄝ」／「ㄆㄧㄝ」開成見"],a:2,e:"兩處都寫作「墨」：潛移默化應為「默」，胸無點墨為「墨」；本題原卷選項疑有辨字或轉錄差異，請教師核對原卷字形。"},

{t:"詞語與成語",q:"「明察秋毫」的意思最接近下列何者？",o:["眼力敏銳，能看清極細微的事物","對事情感到十分驚訝","景象繁多而且十分壯觀","做事謹慎，不敢輕易決定"],a:0,e:"「秋毫」指鳥獸在秋天新生的細毛；「明察秋毫」形容觀察力極敏銳。"},
{t:"詞語與成語",q:"下列哪一個成語適合形容事情結束後，人群逐漸散去的失落？",o:["苦盡甘來","曲終人散","未雨綢繆","見賢思齊"],a:1,e:"「曲終人散」比喻事情結束後，聚集的人各自離去。"},
{t:"詞語與成語",q:"下列「」中的詞語，何者使用正確？",o:["他聰明靈敏，能「舉一反三」，觸類旁通","既然他已認錯，我們就「當仁不讓」吧","母親從不「未雨綢繆」，總是預先做好準備","那種「巧言令色」的人，表面友善，實則別有用心"],a:3,e:"「巧言令色」指花言巧語、表情和善，常形容以言辭和神色討好別人的人。此題依原卷語意判斷；A也符合「舉一反三」的正確用法，題幹可能存在多解，建議教師核對原卷答案。"},
{t:"詞語與成語",q:"「安分守己」與「循規蹈矩」的關係，和下列哪一組相同？",o:["鍥而不捨／功虧一簣","敷衍苟且／苟延殘喘","未雨綢繆／防患未然","道聽塗說／說三道四"],a:2,e:"「安分守己」與「循規蹈矩」意思相近；「未雨綢繆」與「防患未然」也都指事先做好準備。"},

{t:"論語與文言文",q:"「人不知而不慍，不亦君子乎？」主要強調什麼態度？",o:["努力追求名聲與肯定","別人不理解自己時仍不怨恨","凡事都要迎合他人的想法","只和能力比自己好的人交朋友"],a:1,e:"「不知」指別人不了解自己；「不慍」是不怨恨，表現出有修養者不因未獲理解而生氣。"},

{t:"修辭與語文知識",q:"「聽到屋頂上淅淅瀝瀝的雨聲」中的「淅淅瀝瀝」是狀聲詞。下列何者不是形容雨聲的狀聲詞？",o:["滴答","嘩嘩","淅零零","紛紛"],a:3,e:"「紛紛」常形容雨雪繁密飄落的樣子，不是直接模擬聲音的狀聲詞。"},

{t:"詞語與成語",q:"下列文句「」中詞語，何者使用最恰當？",o:["因為他辦事「不利」導致目前情勢對我們十分「不力」，建議趕緊換人處理。","這家餐廳以「無線」暢飲、「無限」上網吸引顧客。","古代朝廷大規模「徵兆」年輕人從軍，多半是戰爭要爆發的「徵召」。","「權力」再大的人，也不能隨意侵犯他人的「權利」。"],a:3,e:"「權力」指職權或支配力量；「權利」指依法享有的利益或資格，兩詞使用正確。",src:"113學年度林園高中國中部第二次段考"},

];
let active=[],answers={},wrongIds=[],roundStart=null;
const letters=["A","B","C","D"];

let wrongMode=false;
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function getHistory(){try{return JSON.parse(localStorage.getItem("qk_history")||"[]")}catch(e){return []}}
function saveHistory(entry){const h=getHistory();h.unshift(entry);localStorage.setItem("qk_history",JSON.stringify(h.slice(0,30)));}
function render(){
 const f=document.getElementById("filter").value;
 let pool=bank.map((x,i)=>({...x,id:i})).filter(x=>(f==="全部"||x.t===f) && (!wrongMode||wrongIds.includes(x.id)));
 active=document.getElementById("shuffle").checked?shuffleArray(pool):pool;
 answers={};roundStart=new Date();
 document.getElementById("total").textContent=active.length;
 document.getElementById("done").textContent="0";document.getElementById("score").textContent="0";
 document.getElementById("bar").style.width="0%";document.getElementById("result").style.display="none";
 document.getElementById("quiz").innerHTML=active.length?active.map((q,n)=>`<section class="question" id="q${n}">
 <div class="qtop"><span>第 ${n+1} 題</span><span class="topic">${q.t}</span></div>
 <div class="stem">${q.q}</div><div class="options">${q.o.map((o,j)=>`<button class="option" onclick="choose(${n},${j})" id="q${n}o${j}"><b>${letters[j]}</b>${o}</button>`).join("")}</div>
 <div class="feedback" id="fb${n}"></div></section>`).join(""):`<p class="panel">目前沒有可重測的錯題。完成一回合後，答錯的題目會自動加入錯題清單。</p>`;
 document.getElementById("wrongOnly").textContent=wrongMode?"返回完整題庫":"錯題重測";
}
function choose(n,j){
 if(answers[n]!==undefined)return;
 const q=active[n];answers[n]=j;const ok=j===q.a;
 if(!ok&&!wrongIds.includes(q.id))wrongIds.push(q.id);
 q.o.forEach((_,k)=>{const el=document.getElementById(`q${n}o${k}`);el.disabled=true;if(k===q.a)el.classList.add("correct");else if(k===j)el.classList.add("wrong")});
 const fb=document.getElementById(`fb${n}`);fb.className="feedback show "+(ok?"good":"bad");
 fb.innerHTML=`<b>${ok?"答對了！":"再記住這個觀念！"} 正確答案：${letters[q.a]}．${q.o[q.a]}</b><div class="explain">解析：${q.e}</div>${q.src?`<div class="explain">來源：${q.src}</div>`:""}`;
 const done=Object.keys(answers).length,score=Object.keys(answers).filter(k=>answers[k]===active[k].a).length;
 document.getElementById("done").textContent=done;document.getElementById("score").textContent=score;
 document.getElementById("bar").style.width=(done/active.length*100)+"%";
 if(done===active.length){
   const pct=Math.round(score/active.length*100);
   saveHistory({date:new Date().toLocaleString("zh-TW"),score,total:active.length,pct,mode:wrongMode?"錯題重測":"一般測驗"});
   document.getElementById("result").style.display="block";
   document.getElementById("summary").textContent=`本回合答對 ${score} / ${active.length} 題，正確率 ${pct}%。${wrongIds.length?`目前錯題累積 ${wrongIds.length} 題，可點「錯題重測」再次練習。`:"本回合全對，太好了！"}`;
 }
}
function resetQuiz(){wrongMode=false;render()}
function showHistory(){
 const box=document.getElementById("history");box.style.display=box.style.display==="none"?"block":"none";
 const h=getHistory();
 document.getElementById("historyList").innerHTML=h.length?h.map((x,i)=>`<div style="padding:7px 0;border-bottom:1px solid #e4e8f0">${i+1}. ${x.date}｜${x.mode}｜${x.score}/${x.total} 題（${x.pct}%）</div>`).join(""):"尚無成績紀錄。紀錄只保存在目前瀏覽器的本機裝置。";
}
document.getElementById("filter").addEventListener("change",()=>{wrongMode=false;render()});
document.getElementById("reset").addEventListener("click",()=>{wrongMode=false;render()});
document.getElementById("wrongOnly").addEventListener("click",()=>{wrongMode=!wrongMode;render()});
document.getElementById("historyBtn").addEventListener("click",showHistory);
document.getElementById("clearHistory").addEventListener("click",()=>{if(confirm("確定清除這台裝置上的成績紀錄？")){localStorage.removeItem("qk_history");showHistory();showHistory();}});
render();

</script>
</body></html>
